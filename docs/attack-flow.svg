<svg xmlns="http://www.w3.org/2000/svg" width="640" height="514" viewBox="0 0 640 514" role="img" aria-labelledby="attack-title attack-desc" xml:lang="ko">
  <title id="attack-title">니케 PC 런처 침해 흐름</title>
  <desc id="attack-desc">레벨 인피니트 CDN의 런처용 스크립트 네 파일이 변조됐다. 니케 런처 내장 브라우저가 외부 스크립트를 불러왔다. 일부 실행에서 원격제어 코드를 내려받아 런처 권한으로 실행했다. 공격자 명령과 결과는 내장 브라우저를 오갔다. 공격자 명령에 따라 Chrome용 DLL과 사용자 레지스트리 항목도 남을 수 있었다.</desc>
  <defs>
    <marker id="attack-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#5d6da6"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="638" height="512" rx="22" fill="#f4f6fc" stroke="#dce2f1" stroke-width="2"/>
  <g fill="none" stroke="#5d6da6" stroke-width="2.5" marker-end="url(#attack-arrow)">
    <path d="M320 100v27"/><path d="M320 200v40"/>
    <path d="M320 314v30H164v34"/><path d="M320 314v30h156v34" stroke-dasharray="5 5"/>
  </g>
  <g fill="#fff" stroke="#d5ddef" stroke-width="1.5">
    <rect x="48" y="30" width="544" height="70" rx="13"/>
    <rect x="48" y="130" width="544" height="70" rx="13"/>
    <rect x="48" y="243" width="544" height="71" rx="13"/>
    <rect x="20" y="381" width="288" height="102" rx="13"/>
    <rect x="332" y="381" width="288" height="102" rx="13"/>
  </g>
  <g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif">
    <g fill="#172752" font-size="22" font-weight="700">
      <text x="72" y="59">1. 배포 서버의 파일 변조</text>
      <text x="72" y="159">2. 런처가 외부 스크립트 로드</text>
      <text x="72" y="272">3. 원격제어 코드 실행</text>
      <text x="40" y="411">런처를 통한 원격 제어</text>
      <text x="352" y="411">Chrome에서 다시 실행</text>
    </g>
    <g fill="#43547a" font-size="17">
      <text x="72" y="83">레벨 인피니트 CDN의 JavaScript 4개</text>
      <text x="72" y="183">내장 브라우저가 변조된 파일을 읽고 l.js 호출</text>
      <text x="72" y="296">insight.bundle 다운로드 후 런처 권한으로 실행</text>
      <text x="40" y="437">내장 브라우저로 명령과 결과 전달</text>
      <text x="40" y="462">파일 접근·화면 캡처·정보 수집</text>
      <text x="352" y="437">Chrome 사용자 폴더에 DLL 저장</text>
      <text x="352" y="462">사용자 설정에 DLL 경로 등록</text>
    </g>
    <g fill="#42568f" font-size="15" font-weight="700">
      <text x="336" y="225">일부 런처 실행에서</text>
      <text x="488" y="367">별도 명령을 받으면</text>
    </g>
  </g>
</svg>
